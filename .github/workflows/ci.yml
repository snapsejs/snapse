name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    # Runs on macOS because the closure-compiler binary pinned in the lockfile is
    # google-closure-compiler-macos. To run on ubuntu-latest instead, add
    # google-closure-compiler-linux to optionalDependencies and regenerate the lockfile.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Verify (check:readme, lint, tests, build, bundle tests)
        run: npm run verify
      - name: Verify packaged types
        run: npm run verify:pack
